<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#1a1c23"/>
  <text x="400" y="40" font-family="sans-serif" font-size="22" font-weight="bold" fill="#00e5ff" text-anchor="middle">
    JARVIS MAIN Gateway — INMP441 I2S Microphone Wiring Schema
  </text>
  
  <rect x="80" y="120" width="220" height="380" rx="10" fill="#2d313f" stroke="#00e5ff" stroke-width="2"/>
  <text x="190" y="150" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">ESP32 WROOM 32</text>
  
  <rect x="500" y="120" width="220" height="380" rx="10" fill="#2d313f" stroke="#00e5ff" stroke-width="2"/>
  <text x="610" y="150" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">INMP441 Microphone</text>

  <!-- WS: GPIO 25 -> MIC WS -->
  <path d="M 300 200 L 500 200" stroke="#7f00ff" stroke-width="2" fill="none"/>
  <circle cx="300" cy="200" r="4" fill="#7f00ff"/>
  <circle cx="500" cy="200" r="4" fill="#7f00ff"/>
  <text x="310" y="195" font-family="monospace" font-size="11" fill="#7f00ff">GPIO 25 (I2S WS)</text>

  <!-- BCLK: GPIO 26 -> MIC SCK -->
  <path d="M 300 250 L 500 250" stroke="#00ff7f" stroke-width="2" fill="none"/>
  <circle cx="300" cy="250" r="4" fill="#00ff7f"/>
  <circle cx="500" cy="250" r="4" fill="#00ff7f"/>
  <text x="310" y="245" font-family="monospace" font-size="11" fill="#00ff7f">GPIO 26 (I2S BCLK)</text>

  <!-- SD: GPIO 33 -> MIC SD -->
  <path d="M 300 300 L 500 300" stroke="#ffaa00" stroke-width="2" fill="none"/>
  <circle cx="300" cy="300" r="4" fill="#ffaa00"/>
  <circle cx="500" cy="300" r="4" fill="#ffaa00"/>
  <text x="310" y="295" font-family="monospace" font-size="11" fill="#ffaa00">GPIO 33 (I2S DATA)</text>

  <!-- L/R Select -> GND -->
  <path d="M 610 500 L 610 530 L 570 530" stroke="#999999" stroke-width="2" fill="none"/>
  <circle cx="610" cy="500" r="4" fill="#999999"/>
  <text x="560" y="520" font-family="sans-serif" font-size="10" fill="#999999">L/R (GND=Left)</text>

  <!-- VDD: 3.3V -> MIC VDD -->
  <path d="M 300 380 L 500 380" stroke="#ff3333" stroke-width="2" fill="none"/>
  <circle cx="300" cy="380" r="4" fill="#ff3333"/>
  <circle cx="500" cy="380" r="4" fill="#ff3333"/>
  <text x="310" y="375" font-family="monospace" font-size="11" fill="#ff3333">3.3V (VDD)</text>

  <!-- GND: GND -> MIC GND -->
  <path d="M 300 430 L 500 430" stroke="#999999" stroke-width="2" fill="none"/>
  <circle cx="300" cy="430" r="4" fill="#999999"/>
  <circle cx="500" cy="430" r="4" fill="#999999"/>
  <text x="310" y="425" font-family="monospace" font-size="11" fill="#999999">GND</text>
</svg>

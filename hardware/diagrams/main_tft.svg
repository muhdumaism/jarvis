<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#1a1c23"/>
  <grid stroke="#2a2d37" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="40" font-family="sans-serif" font-size="22" font-weight="bold" fill="#00e5ff" text-anchor="middle">
    JARVIS MAIN Gateway — SPI TFT Display Wiring Schema
  </text>
  
  <!-- ESP32 module box -->
  <rect x="80" y="120" width="220" height="380" rx="10" fill="#2d313f" stroke="#00e5ff" stroke-width="2"/>
  <text x="190" y="150" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">ESP32 WROOM 32</text>
  
  <!-- TFT module box -->
  <rect x="500" y="120" width="220" height="380" rx="10" fill="#2d313f" stroke="#00e5ff" stroke-width="2"/>
  <text x="610" y="150" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2.8" SPI TFT (ILI9341)</text>

  <!-- Wiring connections -->
  <!-- CS: GPIO 15 -> TFT CS -->
  <path d="M 300 190 L 500 190" stroke="#ff007f" stroke-width="2" fill="none"/>
  <circle cx="300" cy="190" r="4" fill="#ff007f"/>
  <circle cx="500" cy="190" r="4" fill="#ff007f"/>
  <text x="310" y="185" font-family="monospace" font-size="11" fill="#ff007f">GPIO 15 (CS)</text>
  
  <!-- DC: GPIO 2 -> TFT D/C -->
  <path d="M 300 230 L 500 230" stroke="#7f00ff" stroke-width="2" fill="none"/>
  <circle cx="300" cy="230" r="4" fill="#7f00ff"/>
  <circle cx="500" cy="230" r="4" fill="#7f00ff"/>
  <text x="310" y="225" font-family="monospace" font-size="11" fill="#7f00ff">GPIO 2 (D/C)</text>

  <!-- RST: GPIO 4 -> TFT RST -->
  <path d="M 300 270 L 500 270" stroke="#00ff7f" stroke-width="2" fill="none"/>
  <circle cx="300" cy="270" r="4" fill="#00ff7f"/>
  <circle cx="500" cy="270" r="4" fill="#00ff7f"/>
  <text x="310" y="265" font-family="monospace" font-size="11" fill="#00ff7f">GPIO 4 (RST)</text>

  <!-- MOSI: GPIO 13 -> TFT MOSI -->
  <path d="M 300 310 L 500 310" stroke="#ffaa00" stroke-width="2" fill="none"/>
  <circle cx="300" cy="310" r="4" fill="#ffaa00"/>
  <circle cx="500" cy="310" r="4" fill="#ffaa00"/>
  <text x="310" y="305" font-family="monospace" font-size="11" fill="#ffaa00">GPIO 13 (MOSI)</text>

  <!-- SCK: GPIO 14 -> TFT SCK -->
  <path d="M 300 350 L 500 350" stroke="#00aaff" stroke-width="2" fill="none"/>
  <circle cx="300" cy="350" r="4" fill="#00aaff"/>
  <circle cx="500" cy="350" r="4" fill="#00aaff"/>
  <text x="310" y="345" font-family="monospace" font-size="11" fill="#00aaff">GPIO 14 (SCK)</text>

  <!-- VCC: 3.3V -> TFT VCC -->
  <path d="M 300 390 L 500 390" stroke="#ff3333" stroke-width="2" fill="none"/>
  <circle cx="300" cy="390" r="4" fill="#ff3333"/>
  <circle cx="500" cy="390" r="4" fill="#ff3333"/>
  <text x="310" y="385" font-family="monospace" font-size="11" fill="#ff3333">3.3V (VCC)</text>

  <!-- GND: GND -> TFT GND -->
  <path d="M 300 430 L 500 430" stroke="#999999" stroke-width="2" fill="none"/>
  <circle cx="300" cy="430" r="4" fill="#999999"/>
  <circle cx="500" cy="430" r="4" fill="#999999"/>
  <text x="310" y="425" font-family="monospace" font-size="11" fill="#999999">GND</text>
  
  <!-- Status footer notes -->
  <rect x="80" y="520" width="640" height="50" rx="5" fill="#20222a" stroke="#ffaa00" stroke-width="1"/>
  <text x="100" y="550" font-family="sans-serif" font-size="12" fill="#ffaa00" font-weight="bold">
    NOTE: Uses hardware HSPI interface. Keep wires as short as possible to avoid SPI high frequency signal noise.
  </text>
</svg>
